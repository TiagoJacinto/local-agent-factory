pre-commit:
  jobs:
    - name: scan staged changes for secrets
      run: gitleaks protect --staged --redact

    - name: format staged files
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: bunx --no-install oxfmt {staged_files}
      stage_fixed: true

    - name: lint staged files
      glob: "*.{js,jsx,ts,tsx}"
      run: bun run lint:staged -- {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: scan Git history for secrets
      run: gitleaks detect --redact

    - name: check formatting
      run: bun run format:check

    - name: lint all source and test files
      run: bun run lint

    - name: typecheck
      run: bun run typecheck

    - name: unit tests
      run: bun run test:unit
